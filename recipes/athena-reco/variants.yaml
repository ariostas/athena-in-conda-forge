# Athena 25.0.73 is built and validated against ROOT 6.40.02 in C++23 mode (an exact match
# with conda-forge's root_base 6.40.2, root_cxx_standard 23) and Boost 1.91; conda-forge's
# closest is 1.90, which it is migrating to (migrations/libboost190.yaml in the pinning). Every
# library in the stack must use the same ones. Drop the boost block once the global pinning
# moves.
# On macOS 6.40.04: 6.40.02's TTreeIndex rounds 64-bit keys to the precision of long double,
# which is double on Apple silicon, so POOL cannot find the entries of files whose index_ref
# values are beyond 2^53 (ROOT's fix: a cast in TTreeIndex's constructor, in 6.40.04).
root_base:
  - if: osx
    then: "6.40.4"
    else: "6.40.2"
root_cxx_standard:
  - "23"
libboost_devel:
  - "1.90"
libboost_headers:
  - "1.90"
libboost_python_devel:
  - "1.90"

# ATLAS uses its fork of CLHEP 2.4.7.1. clhep is zipped with geant4 in the global pinning,
# where 2.4.7.1 goes with 11.3.2.
clhep:
  - "2.4.7.1"
geant4:
  - "11.3.2"

# ATLAS builds for EL9 (glibc 2.34). conda-forge's default 2.17 lacks mallinfo2, which Athena
# uses, and pulls in the old pthread and librt split. On macOS, std::format's floating point
# support (std::to_chars) needs 13.3.
c_stdlib_version:
  - if: linux
    then: "2.34"
    else: "13.3"
MACOSX_DEPLOYMENT_TARGET:
  - if: osx
    then: "13.3"

# ATLAS builds with Eigen 3.4 (3.4.1 in LCG_110). conda-forge's global pinning has moved to
# Eigen 5, which is not API compatible (e.g. Eigen/Core no longer includes <cassert>): every
# package with Eigen in its interface is built against eigen-abi-devel 3.4, whose run export
# keeps it from being mixed with Eigen 5 builds.
eigen_abi_devel:
  - "3.4.0.100"

# On macOS, the compiler of conda-forge's ROOT 6.40 (clang 20): an environment with ROOT and a
# compiler (a test, a user's work area) cannot hold another libcxx-devel than ROOT's, and cling
# then parses the same libc++ headers as the compiled code saw. Elsewhere the global pinning's.
c_compiler_version:
  - if: osx
    then: "20"
    else: "15"
cxx_compiler_version:
  - if: osx
    then: "20"
    else: "15"
