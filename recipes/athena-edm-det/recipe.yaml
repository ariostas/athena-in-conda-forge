context:
  version: "25.0.73"

package:
  name: athena-edm-det
  version: ${{ version }}

source:
  url: https://gitlab.cern.ch/atlas/athena/-/archive/release/${{ version }}/athena-release-${{ version }}.tar.gz
  sha256: e2df75b2fd966f97973e9ed89984222e4070be0d60ace0a4f3975e80e9ec1eba

build:
  number: 0
  skip:
    - not linux
    - match(python, "<3.13")
  script:
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # AthExFortranAlgorithm
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - athena-edm ==${{ version }}
    # EventShapeEvent. FastJet 3.5.1, as in ATLAS's release. Build 5 is the last that has the
    # headers: since build 6 they are in fastjet-cxx-devel, which requires cgal-cpp, and no
    # cgal-cpp goes with both Boost 1.90 and Eigen 3.4 (the 1.90 builds need eigen-abi 5).
    - fastjet-cxx ==3.5.1 *_5
    # the externals of the layers below, whose headers this layer includes
    - athena-detdescr ==${{ version }}
    - athena-core ==${{ version }}
    - libxml2
    - geomodel-core ==6.29.0
    - geomodel-tools ==6.29.0
    - atlas-acts ==47.7.0
    - gsl
    - athena-externals ==${{ version }}
    - atlas-gaudi
    - lcg-coral
    - lcg-cool
    - crestapi
    - chai
    - tdaq-common
    - yampl
    - boost-mpi3
    - openmpi
    - python
    - root_base
    - root_cxx_standard
    - libboost-devel
    - libboost-python-devel
    - tbb-devel
    - eigen
    - eigen-abi-devel
    - clhep
    - libuuid
    - nlohmann_json
    - fmt
    - range-v3
    - ms-gsl
    - xerces-c
    - zlib
    - sqlite
    - gtest
    - gmock
    - cppunit
    - expat
    - aida
    - heppdt
    - zeromq
    - cppzmq
    - hepmc3
    # ByteStream input from remote storage
    - xrootd
    - davix
    # EventIndexProducer
    - libprotobuf
    # PerfMonGPerfTools
    - gperftools
    # headers only (AthenaServices)
    - valgrind
    - libcurl
    - vdt
    # the build draws the python import graph of the packages (apydep)
    - pygraphviz
  run:
    - athena-edm ==${{ version }}
    - python
    - root_base

tests:
  - script:
      # Athena reads ATLAS's Run 3 HITS, RDO and ESD test files, dumps every object in them and
      # writes copies, which it reads back; checked against ATLAS's release. Needs CVMFS.
      - bash test/run_pool.sh
      # ATLAS's T/P converter tests: old files read and compared with references, from CVMFS
      - bash test/run_tpcnv.sh
      # every component of the layer has its configurable
      - python test/check_confdb.py "${AthenaEDMDet_DIR}/lib/AthenaEDMDet.components"
    files:
      recipe:
        - test/
      # the references of the T/P tests that have no reference tag
      source:
        - ForwardDetectors/ZDC/ZdcCnv/ZdcEventAthenaPool/share/
        - InnerDetector/InDetEventCnv/InDetBCM_EventAthenaPool/share/
        - LArCalorimeter/LArCnv/LArAthenaPool/share/

about:
  homepage: https://gitlab.cern.ch/atlas/athena
  summary: The detector event data layer of ATLAS's Athena software
  description: |
    Athena is the offline software of the ATLAS experiment at CERN, built on the Gaudi
    framework. This package is the fourth of the layers Athena is split into for conda-forge,
    on top of athena-edm: the detector-level event data (simulation hits, raw data objects,
    prepared raw data and calibrated measurements of every subdetector) with its persistent
    forms, converters and dictionaries, to read and write HITS, RDO and ESD files.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://gitlab.cern.ch/atlas/athena

extra:
  recipe-maintainers:
    - ariostas
