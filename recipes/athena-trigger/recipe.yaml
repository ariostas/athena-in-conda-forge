context:
  version: "25.0.73"

package:
  name: athena-trigger
  version: ${{ version }}

source:
  url: https://gitlab.cern.ch/atlas/athena/-/archive/release/${{ version }}/athena-release-${{ version }}.tar.gz
  sha256: e2df75b2fd966f97973e9ed89984222e4070be0d60ace0a4f3975e80e9ec1eba
  patches:
    # libc++ and macOS: glibc's sincos() and HOST_NAME_MAX
    - 0001-libc++-and-macOS.patch

build:
  number: 0
  skip:
    - win
    - match(python, "<3.13")
  script:
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # AthExFortranAlgorithm
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    # AtlasLCG's Findlz4
    - pkg-config
  host:
    - athena-reco ==${{ version }}
    # the externals of the layers below, whose headers this layer includes:
    - libblas
    - liblapack
    - fftw
    - libtirpc
    # flavour tagging, tau, egamma and lepton identification networks
    - onnxruntime-cpp 1.26.* *_cpu
    - lwtnn
    # jet substructure (as in ATLAS's release, fjcontrib 1.10x on FastJet 3.5.1)
    - fastjet-contrib
    # HDF5Utils, the HDF5 writers of flavour tagging
    - hdf5
    - lz4-c
    # PDF reweighting (ReweightUtils, AsgAnalysisAlgorithms)
    - lhapdf
    # the python bindings of the columnar tools (ColumnarToolWrapperPython)
    - nanobind
    # the YAML configurations of the CP algorithms (the unit tests run them)
    - pyyaml
    - fastjet-cxx ==3.5.1 *_5
    - athena-reco-tracking ==${{ version }}
    - athena-analysis ==${{ version }}
    - athena-edm-det ==${{ version }}
    - athena-edm ==${{ version }}
    - athena-detdescr ==${{ version }}
    - athena-core ==${{ version }}
    - libxml2
    - geomodel-core ==6.29.0
    - geomodel-tools ==6.29.0
    - atlas-acts ==47.7.0
    - gsl
    - athena-externals ==${{ version }}
    - atlas-gaudi
    - lcg-coral
    - lcg-cool
    - crestapi
    - chai
    - tdaq-common
    - if: linux
      then: yampl
    - boost-mpi3
    - openmpi
    - python
    - root_base
    - root_cxx_standard
    - libboost-devel
    - libboost-python-devel
    - tbb-devel
    - eigen
    - eigen-abi-devel
    - clhep
    - libuuid
    - nlohmann_json
    - fmt
    - range-v3
    - ms-gsl
    - xerces-c
    - zlib
    - sqlite
    - gtest
    - gmock
    - cppunit
    - expat
    - aida
    - heppdt
    - zeromq
    - cppzmq
    - hepmc3
    # ByteStream input from remote storage
    - xrootd
    - davix
    # EventIndexProducer
    - libprotobuf
    # PerfMonGPerfTools
    - gperftools
    # headers only (AthenaServices)
    - if: linux
      then: valgrind
    - libcurl
    - vdt
    # the build draws the python import graph of the packages (apydep)
    - pygraphviz
  run:
    - athena-reco ==${{ version }}
    - python
    - root_base
    # the trigger configuration's CREST access (TrigConfStorage)
    - pycrest-client

tests:
  - script:
      # ATLAS's HLT with its Dev menu on ATLAS's Run 3 RDO test file (RDO to RDO_TRIG), with
      # CVMFS: the trigger decisions and objects are checked against ATLAS's release
      - bash test/run_trigger.sh
      # every component of the layer has its configurable
      - python test/check_confdb.py "${AthenaTrigger_DIR}/lib/AthenaTrigger.components"
    files:
      recipe:
        - test/

about:
  homepage: https://gitlab.cern.ch/atlas/athena
  summary: The trigger layer of ATLAS's Athena software (L1 simulation, High-Level Trigger)
  description: |
    Athena is the offline software of the ATLAS experiment at CERN, built on the Gaudi
    framework. This package is the eighth of the layers Athena is split into for conda-forge,
    on top of athena-reco: the simulation of the Level-1 trigger and the High-Level Trigger
    (steering, algorithms and hypotheses of every signature, the menu), the trigger's event
    data conversion, its monitoring and analysis tools: the trigger in RDO to RDO_TRIG and in
    RAW to ESD/AOD reconstruction.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://gitlab.cern.ch/atlas/athena

extra:
  recipe-maintainers:
    - ariostas
