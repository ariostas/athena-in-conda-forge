context:
  version: "25.0.73"

package:
  name: athena-detdescr
  version: ${{ version }}

source:
  url: https://gitlab.cern.ch/atlas/athena/-/archive/release/${{ version }}/athena-release-${{ version }}.tar.gz
  sha256: e2df75b2fd966f97973e9ed89984222e4070be0d60ace0a4f3975e80e9ec1eba

build:
  number: 0
  skip:
    - not linux
    - match(python, "<3.13")
  script:
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # AthExFortranAlgorithm
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - athena-core ==${{ version }}
    # the externals of this layer
    - geomodel-core ==6.29.0
    - geomodel-tools ==6.29.0
    - atlas-acts ==47.7.0
    # IdDictParser
    - libxml2
    # GeoSpecialShapes
    - gsl
    # the externals of the layers below, whose headers this layer includes
    - athena-externals ==${{ version }}
    - atlas-gaudi
    - lcg-coral
    - lcg-cool
    - crestapi
    - chai
    - tdaq-common
    - yampl
    - boost-mpi3
    - openmpi
    - python
    - root_base
    - root_cxx_standard
    - libboost-devel
    - libboost-python-devel
    - tbb-devel
    - eigen
    - eigen-abi-devel
    - clhep
    - libuuid
    - nlohmann_json
    - fmt
    - range-v3
    - ms-gsl
    - xerces-c
    - zlib
    - sqlite
    - gtest
    - gmock
    - cppunit
    - expat
    - aida
    - heppdt
    - zeromq
    - cppzmq
    - hepmc3
    # ByteStream input from remote storage
    - xrootd
    - davix
    # EventIndexProducer
    - libprotobuf
    # PerfMonGPerfTools
    - gperftools
    # headers only (AthenaServices)
    - valgrind
    - libcurl
    - vdt
    # the build draws the python import graph of the packages (apydep)
    - pygraphviz
  run:
    - athena-core ==${{ version }}
    - python
    - root_base

tests:
  - script:
      # identifiers decoded with the ID dictionaries of the release (no database needed)
      - python test/check_ids.py
      # the ATLAS geometry built from the geometry database, when CVMFS provides it
      - bash test/run_geometry.sh
      # every component of the layer has its configurable
      - python test/check_confdb.py "${AthenaDetDescr_DIR}/lib/AthenaDetDescr.components"
    files:
      recipe:
        - test/

about:
  homepage: https://gitlab.cern.ch/atlas/athena
  summary: The detector description layer of ATLAS's Athena software
  description: |
    Athena is the offline software of the ATLAS experiment at CERN, built on the Gaudi
    framework. This package is the second of the layers Athena is split into for conda-forge,
    on top of athena-core: identifiers and the identifier dictionaries, the GeoModel geometry
    of every subdetector, the readout geometry, the tracking geometry (legacy and ACTS), the
    magnetic field, cabling and detector conditions data.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://gitlab.cern.ch/atlas/athena

extra:
  recipe-maintainers:
    - ariostas
