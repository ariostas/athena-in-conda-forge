context:
  version: "25.0.73"

package:
  name: athena-sim
  version: ${{ version }}

source:
  url: https://gitlab.cern.ch/atlas/athena/-/archive/release/${{ version }}/athena-release-${{ version }}.tar.gz
  sha256: e2df75b2fd966f97973e9ed89984222e4070be0d60ace0a4f3975e80e9ec1eba

build:
  number: 0
  skip:
    - win
    - match(python, "<3.13")
  script:
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # AthExFortranAlgorithm
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    # AtlasLCG's Findlz4
    - pkg-config
  host:
    - athena-trigger ==${{ version }}
    # Geant4 as ATLAS builds it (static: linked into the AtlasGeant4 component)
    - atlas-geant4 ==10.6.3.15
    - veccore
    # the generator interfaces (Pythia8_i, Pythia8B_i, G4ExternalDecay, Rivet_i, TruthRivetTools)
    - pythia8
    - atlas-rivet
    - yoda
    - highfive
    - athena-reco ==${{ version }}
    # the externals of the layers below, whose headers this layer includes:
    - libblas
    - liblapack
    - fftw
    - libtirpc
    # flavour tagging, tau, egamma and lepton identification networks
    - onnxruntime-cpp 1.26.* *_cpu
    - lwtnn
    # jet substructure (as in ATLAS's release, fjcontrib 1.10x on FastJet 3.5.1)
    - fastjet-contrib
    # HDF5Utils, the HDF5 writers of flavour tagging
    - hdf5
    - lz4-c
    # PDF reweighting (ReweightUtils, AsgAnalysisAlgorithms)
    - lhapdf
    # the python bindings of the columnar tools (ColumnarToolWrapperPython)
    - nanobind
    # the YAML configurations of the CP algorithms (the unit tests run them)
    - pyyaml
    - fastjet-cxx ==3.5.1 *_5
    - athena-reco-tracking ==${{ version }}
    - athena-analysis ==${{ version }}
    - athena-edm-det ==${{ version }}
    - athena-edm ==${{ version }}
    - athena-detdescr ==${{ version }}
    - athena-core ==${{ version }}
    - libxml2
    - geomodel-core ==6.29.0
    - geomodel-tools ==6.29.0
    - atlas-acts ==47.7.0
    - gsl
    - athena-externals ==${{ version }}
    - atlas-gaudi
    - lcg-coral
    - lcg-cool
    - crestapi
    - chai
    - tdaq-common
    - if: linux
      then: yampl
    - boost-mpi3
    - openmpi
    - python
    - root_base
    - root_cxx_standard
    - libboost-devel
    - libboost-python-devel
    - tbb-devel
    - eigen
    - eigen-abi-devel
    - clhep
    - libuuid
    - nlohmann_json
    - fmt
    - range-v3
    - ms-gsl
    - xerces-c
    - zlib
    - sqlite
    - gtest
    - gmock
    - cppunit
    - expat
    - aida
    - heppdt
    - zeromq
    - cppzmq
    - hepmc3
    # ByteStream input from remote storage
    - xrootd
    - davix
    # EventIndexProducer
    - libprotobuf
    # PerfMonGPerfTools
    - gperftools
    # headers only (AthenaServices)
    - if: linux
      then: valgrind
    - libcurl
    - vdt
    # the build draws the python import graph of the packages (apydep)
    - pygraphviz
  run:
    - athena-trigger ==${{ version }}
    - python
    - root_base
    # Geant4 10.6's data sets (the versions of geant4make.sh in ATLAS's Geant4, and of ATLAS's
    # G4PATH data on CVMFS), which set G4LEDATA and the others when the environment is activated
    - geant4-data-abla ==3.1
    - geant4-data-emlow ==7.9.1
    - geant4-data-ensdfstate ==2.2
    - geant4-data-incl ==1.0
    - geant4-data-ndl ==4.6
    - geant4-data-particlexs ==2.1
    - geant4-data-photonevaporation ==5.5
    - geant4-data-pii ==1.3
    - geant4-data-radioactivedecay ==5.4
    - geant4-data-realsurface ==2.1.1
    - geant4-data-saiddata ==2.0
  ignore_run_exports:
    from_package:
      # static libraries, linked into the layer's libraries
      - atlas-geant4

tests:
  - script:
      # ATLAS's Run 3 simulation (Sim_tf.py, FullG4MT_QS, MC23e) of ttbar events from ATLAS's
      # test file on CVMFS: the hits are checked against ATLAS's release
      - bash test/run_sim.sh
      # every component of the layer has its configurable
      - python test/check_confdb.py "${AthenaSim_DIR}/lib/AthenaSim.components"
    files:
      recipe:
        - test/

about:
  homepage: https://gitlab.cern.ch/atlas/athena
  summary: The simulation layer of ATLAS's Athena software (Geant4 simulation, ISF, generators)
  description: |
    Athena is the offline software of the ATLAS experiment at CERN, built on the Gaudi
    framework. This package is the ninth of the layers Athena is split into for conda-forge,
    on top of athena-trigger: the detector simulation with Geant4 (ATLAS's Geant4 10.6 build,
    the sensitive detectors of every subdetector, physics lists), the integrated simulation
    framework with its fast simulations (FastCaloSim, Fatras), the simulation job transforms
    (Sim_tf.py: EVNT to HITS), and the interfaces to the event generators available on
    conda-forge (Pythia8, LHAPDF, Rivet).
  license: Apache-2.0
  license_file: LICENSE
  repository: https://gitlab.cern.ch/atlas/athena

extra:
  recipe-maintainers:
    - ariostas
