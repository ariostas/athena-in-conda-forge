context:
  version: "25.0.73"

package:
  name: athena-edm
  version: ${{ version }}

source:
  - url: https://gitlab.cern.ch/atlas/athena/-/archive/release/${{ version }}/athena-release-${{ version }}.tar.gz
    sha256: e2df75b2fd966f97973e9ed89984222e4070be0d60ace0a4f3975e80e9ec1eba
  # For the tests: a DAOD_PHYSLITE file of ATLAS Open Data (CC0-1.0), 2015 data, run 276183,
  # 132 events, from https://doi.org/10.7483/OPENDATA.ATLAS.AOQL.8TT3
  - url: https://opendata.cern.ch/eos/opendata/atlas/rucio/data15_13TeV/DAOD_PHYSLITE.37001701._000001.pool.root.1
    sha256: 1043dd056a40d7fe3cd3758c99b5a6b4bcd723078c3e4ad8abd318450adb52bf
    target_directory: opendata

build:
  number: 0
  skip:
    - not linux
    - match(python, "<3.13")
  script:
    file: build.sh

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # AthExFortranAlgorithm
    - ${{ compiler('fortran') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
  host:
    - athena-detdescr ==${{ version }}
    # GoodRunsLists
    - libxml2
    # the externals of the layers below, whose headers this layer includes
    - athena-core ==${{ version }}
    - geomodel-core ==6.29.0
    - geomodel-tools ==6.29.0
    - atlas-acts ==47.7.0
    - gsl
    - athena-externals ==${{ version }}
    - atlas-gaudi
    - lcg-coral
    - lcg-cool
    - crestapi
    - chai
    - tdaq-common
    - yampl
    - boost-mpi3
    - openmpi
    - python
    - root_base
    - root_cxx_standard
    - libboost-devel
    - libboost-python-devel
    - tbb-devel
    - eigen
    - eigen-abi-devel
    - clhep
    - libuuid
    - nlohmann_json
    - fmt
    - range-v3
    - ms-gsl
    - xerces-c
    - zlib
    - sqlite
    - gtest
    - gmock
    - cppunit
    - expat
    - aida
    - heppdt
    - zeromq
    - cppzmq
    - hepmc3
    # ByteStream input from remote storage
    - xrootd
    - davix
    # EventIndexProducer
    - libprotobuf
    # PerfMonGPerfTools
    - gperftools
    # headers only (AthenaServices)
    - valgrind
    - libcurl
    - vdt
    # the build draws the python import graph of the packages (apydep)
    - pygraphviz
  run:
    - athena-detdescr ==${{ version }}
    - python
    - root_base

tests:
  - script:
      # Athena reads a DAOD_PHYSLITE file (ATLAS Open Data), dumps every object in it and
      # writes a copy, which it reads back; PyROOT reads both. Checked against ATLAS's release.
      - bash test/run_xaod.sh
      # ATLAS's T/P converter tests: old AODs read and compared with references, from CVMFS
      - bash test/run_tpcnv.sh
      # every component of the layer has its configurable
      - python test/check_confdb.py "${AthenaEDM_DIR}/lib/AthenaEDM.components"
    files:
      recipe:
        - test/
      source:
        - opendata/

about:
  homepage: https://gitlab.cern.ch/atlas/athena
  summary: The event data model layer of ATLAS's Athena software
  description: |
    Athena is the offline software of the ATLAS experiment at CERN, built on the Gaudi
    framework. This package is the third of the layers Athena is split into for conda-forge,
    on top of athena-detdescr: the event data model (xAOD, trigger, tracking and older
    analysis classes) with its persistent forms, converters and dictionaries, to read and
    write AOD and DAOD files in Athena and in PyROOT.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://gitlab.cern.ch/atlas/athena

extra:
  recipe-maintainers:
    - ariostas
